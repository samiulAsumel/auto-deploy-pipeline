# ════════════════════════════════════════════════════════════════════════════
# Automated Deployment Pipeline — Configuration  v1.0.0
# Edit this file to match your environment.  Sourced by all deploy scripts.
# For per-environment overrides: config.production.conf / config.staging.conf
# ════════════════════════════════════════════════════════════════════════════

# ── Application identity ──────────────────────────────────────────────────────
APP_NAME="myapp"
APP_USER="appuser"                 # OS user that owns the app files
APP_GROUP="appuser"                # OS group for app files

# ── Repository ────────────────────────────────────────────────────────────────
REPO_URL="git@github.com:company/app.git"
BRANCH="main"                      # branch, tag, or commit SHA to deploy

# ── Directory layout ──────────────────────────────────────────────────────────
DEPLOY_BASE="/var/www"
RELEASES_DIR="/var/www/releases"   # timestamped release directories
CURRENT_LINK="/var/www/current"    # symlink pointing to the active release
SHARED_DIR="/var/www/shared"       # .env, uploads, storage — persists across deploys

# ── Release management ────────────────────────────────────────────────────────
KEEP_RELEASES=5                    # number of old release dirs to keep

# ── Application type ──────────────────────────────────────────────────────────
# nodejs | python | php | static
APP_TYPE="nodejs"

# ── Build step ────────────────────────────────────────────────────────────────
BUILD_ENABLED=true                 # true = run a build command after install
BUILD_CMD="npm run build"          # command to run in the release directory

# ── Testing ───────────────────────────────────────────────────────────────────
RUN_TESTS=true                     # true = run test suite before switching
TEST_CMD="npm test"                # command to run (must exit 0 on pass)
TEST_TIMEOUT=300                   # seconds before test run is killed

# ── Shared files / symlinks ───────────────────────────────────────────────────
# Relative paths inside RELEASES_DIR that should be symlinked from SHARED_DIR.
# Space-separated.  Created on first deploy; persisted across releases.
SHARED_FILES=".env storage uploads"

# ── Web server ────────────────────────────────────────────────────────────────
# nginx | apache | none
WEBSERVER="nginx"
NGINX_SERVICE="nginx"
APACHE_SERVICE="httpd"             # httpd on RHEL, apache2 on Ubuntu

# ── App server / process manager ─────────────────────────────────────────────
# pm2 | gunicorn | php-fpm | none
APP_SERVER="pm2"
PM2_APP_NAME="myapp"               # pm2 ecosystem name
GUNICORN_SERVICE="gunicorn"        # systemd service name for gunicorn
PHP_FPM_SERVICE="php-fpm"          # systemd service name for php-fpm

# ── Health check ─────────────────────────────────────────────────────────────
HEALTH_URL="http://localhost:3000/health"
HEALTH_RETRIES=3                   # attempts before marking failed
HEALTH_RETRY_INTERVAL=10           # seconds between retries
HEALTH_WARMUP=10                   # seconds to wait before first health check

# ── Database migration ────────────────────────────────────────────────────────
DB_MIGRATE=false                   # true = run migration command after deploy
DB_MIGRATE_CMD="npm run db:migrate"
DB_HOST="localhost"                # checked in pre-flight
DB_PORT=5432                       # 3306=mysql, 5432=postgres

# ── Pre-flight checks ─────────────────────────────────────────────────────────
MIN_DISK_MB=2048                   # minimum free disk space in MB
CHECK_DB=true                      # true = verify DB is reachable before deploy

# ── Rollback ──────────────────────────────────────────────────────────────────
AUTO_ROLLBACK=true                 # true = auto-rollback on health-check failure
ROLLBACK_STATE_FILE="/tmp/deploy_previous"

# ── Notifications ─────────────────────────────────────────────────────────────
NOTIFY_METHOD="slack"              # email | slack | both | none
NOTIFY_ON="both"                   # success | failure | both
NOTIFY_EMAIL="devops@company.com"
SLACK_WEBHOOK=""                   # https://hooks.slack.com/services/...

# ── Logging ───────────────────────────────────────────────────────────────────
LOG_DIR="/var/log/deploys"
LOG_MAX_DAYS=30                    # delete deploy logs older than N days

# ── State ─────────────────────────────────────────────────────────────────────
STATE_DIR="/var/lib/autodeploy"
LOCK_FILE="${STATE_DIR}/deploy.lock"

# ── Version ───────────────────────────────────────────────────────────────────
VERSION="1.0.0"
